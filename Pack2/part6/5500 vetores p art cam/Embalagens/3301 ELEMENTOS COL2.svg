<instructions></instructions>
<description>Kyoto Kuties: Box - These Kyoto Kuties are so cute!&lt;br&gt;
&lt;br&gt;
Cut It files are designed specifically with cutting machines in mind. Each Cut It set includes several different file formats (ai, dxf, eps, gsd, jpg, pdf and svg). Here is a &lt;a href=&quot;http://www.letteringdelights.com/cutitfilecomparison.php&quot; target=&quot;_blank&quot;&gt;chart&lt;/a&gt; that shows you which cutting machines each graphic format works with. If you don't have a cutting machine, you can still use these graphics, but you will need to use a third party software program.</description>
